name: Remove a member
description: Remove a member from a collection of this archive (earlier versions of the collection keep it).
title: "Remove: "
labels: ["osheaf: remove"]
body:
  - type: input
    attributes:
      label: Member to remove
      description: The member's identifier.
    validations:
      required: true
  - type: input
    attributes:
      label: In collection
      description: The identifier of the collection of this archive (see its collections/ folder).
    validations:
      required: true
  - type: input
    attributes:
      label: Archive of the member
      description: Only if two members have the same identifier.
  - type: input
    attributes:
      label: Why (optional)
      description: Recorded with the new version of the collection.
